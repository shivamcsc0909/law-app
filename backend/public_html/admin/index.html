<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyayaSetu Admin Portal | India Legal Ecosystem</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & Babel CDN for standalone deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0B1426;
      color: #F8FAFC;
      display: flex;
      min-height: 100vh;
    }
    #root { display: flex; width: 100%; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background-color: #070D18;
      border-right: 1px solid #1E293B;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand-box {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1E293B;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background-color: #1E293B;
      color: #D4AF37;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .brand-title { font-size: 18px; font-weight: 800; color: #F8FAFC; }
    .brand-sub { font-size: 11px; font-weight: 700; color: #D4AF37; text-transform: uppercase; }
    .nav-list { list-style: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      color: #94A3B8;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      background-color: #1E293B;
      color: #D4AF37;
    }
    .nav-badge {
      margin-left: auto;
      background-color: rgba(245, 158, 11, 0.2);
      color: #F59E0B;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .topbar {
      height: 64px;
      background-color: #0F172A;
      border-bottom: 1px solid #1E293B;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .live-badge {
      background-color: rgba(16, 185, 129, 0.2);
      color: #10B981;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    .admin-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background-color: #D4AF37;
      color: #0B1426;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .content-area {
      padding: 32px;
      max-width: 1300px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .kpi-card {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .kpi-card.highlight {
      border-color: #F59E0B;
      background-color: #1E293B;
    }
    .kpi-title { font-size: 13px; color: #94A3B8; font-weight: 600; }
    .kpi-val { font-size: 32px; font-weight: 800; color: #F8FAFC; margin: 8px 0; }
    .kpi-sub { font-size: 12px; color: #10B981; font-weight: 600; }
    .table-card {
      background-color: #0F172A;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .table-head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .table-title { font-size: 18px; font-weight: 700; color: #F8FAFC; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { color: #94A3B8; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid #334155; }
    td { padding: 14px 16px; border-bottom: 1px solid #1E293B; color: #F8FAFC; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-gold { background-color: #D4AF37; color: #0B1426; }
    .btn-green { background-color: #10B981; color: #FFFFFF; }
    .btn-red { background-color: #EF4444; color: #FFFFFF; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #94A3B8; }
    .btn-outline:hover { border-color: #94A3B8; color: #F8FAFC; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-pending { background-color: rgba(245, 158, 11, 0.2); color: #F59E0B; }
    .badge-verified { background-color: rgba(16, 185, 129, 0.2); color: #10B981; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminApp() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [metrics, setMetrics] = useState({
        total_users: 1420,
        total_lawyers: 580,
        verified_lawyers: 390,
        pending_verifications: 14,
        total_posts: 3200,
        total_jobs: 145,
        total_cases: 680,
        pending_reports: 3
      });

      const [requests, setRequests] = useState([
        { id: 1, full_name: 'Adv. Ananya Deshmukh', bar_state: 'Bar Council of Maharashtra & Goa', enrollment_number: 'MAH/5829/2016', primary_court: 'Bombay High Court', exp: '8 Yrs', status: 'pending' },
        { id: 2, full_name: 'Adv. Sameer Qureshi', bar_state: 'Bar Council of Uttar Pradesh', enrollment_number: 'UP/3041/2020', primary_court: 'Allahabad High Court', exp: '4 Yrs', status: 'pending' },
        { id: 3, full_name: 'Adv. Rajeshwar Kulkarni', bar_state: 'Bar Council of Karnataka', enrollment_number: 'KAR/1102/2018', primary_court: 'Karnataka High Court', exp: '6 Yrs', status: 'pending' }
      ]);

      const [users, setUsers] = useState([
        { id: 1, full_name: 'Adv. Vikram Sharma', email: 'adv.vikram.sharma@nyayasetu.in', role: 'Senior Advocate', court: 'Delhi High Court', verified: true, active: true },
        { id: 2, full_name: 'Adv. Ananya Deshmukh', email: 'ananya.deshmukh@lawchambers.in', role: 'Advocate', court: 'Bombay High Court', verified: true, active: true },
        { id: 3, full_name: 'Rohit Verma', email: 'rohit.verma@nludelhi.ac.in', role: 'Law Student', court: 'NLU Delhi', verified: false, active: true },
        { id: 4, full_name: 'Rahul Mehta', email: 'rahul.mehta.delhi@gmail.com', role: 'Citizen / Client', court: 'Delhi NCR', verified: false, active: true },
        { id: 6, full_name: 'Lex Bharat Chambers LLP', email: 'contact@lexbharatchambers.com', role: 'Law Firm', court: 'New Delhi', verified: true, active: true }
      ]);

      const [alertMsg, setAlertMsg] = useState(null);

      const handleApprove = (id) => {
        setRequests(requests.filter(r => r.id !== id));
        setMetrics(m => ({ ...m, verified_lawyers: m.verified_lawyers + 1, pending_verifications: m.pending_verifications - 1 }));
        setAlertMsg(`Advocate Bar Credentials approved. Verified Badge granted.`);
        setTimeout(() => setAlertMsg(null), 4000);
      };

      const handleReject = (id) => {
        setRequests(requests.filter(r => r.id !== id));
        setMetrics(m => ({ ...m, pending_verifications: m.pending_verifications - 1 }));
        setAlertMsg(`Verification request rejected.`);
        setTimeout(() => setAlertMsg(null), 4000);
      };

      return (
        <div style={{ display: 'flex', width: '100%' }}>
          {/* Sidebar */}
          <div className="sidebar">
            <div className="brand-box">
              <div className="brand-icon">⚖️</div>
              <div>
                <div className="brand-title">NyayaSetu</div>
                <div className="brand-sub">Admin Portal</div>
              </div>
            </div>

            <ul className="nav-list">
              <li className={`nav-item ${currentTab === 'dashboard' ? 'active' : ''}`} onClick={() => setCurrentTab('dashboard')}>
                <span>📊 Dashboard</span>
              </li>
              <li className={`nav-item ${currentTab === 'verifications' ? 'active' : ''}`} onClick={() => setCurrentTab('verifications')}>
                <span>🛡️ Bar Verifications</span>
                {metrics.pending_verifications > 0 && <span className="nav-badge">{metrics.pending_verifications}</span>}
              </li>
              <li className={`nav-item ${currentTab === 'users' ? 'active' : ''}`} onClick={() => setCurrentTab('users')}>
                <span>👥 Users & Advocates</span>
              </li>
              <li className={`nav-item ${currentTab === 'moderation' ? 'active' : ''}`} onClick={() => setCurrentTab('moderation')}>
                <span>🚨 Content Moderation</span>
              </li>
            </ul>

            <div style={{ marginTop: 'auto', padding: '16px', borderTop: '1px solid #1E293B', fontSize: '11px', color: '#64748B' }}>
              Hostinger Shared Hosting Ready<br />
              PHP 8.x • MySQL 8.0+ PDO
            </div>
          </div>

          {/* Main Area */}
          <div className="main-wrapper">
            <div className="topbar">
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <span style={{ fontWeight: 700, fontSize: '15px' }}>Command Center</span>
                <span className="live-badge">Hostinger Production Live</span>
              </div>
              <div className="admin-profile">
                <div className="avatar-circle">AD</div>
                <div>
                  <div style={{ fontSize: '13px', fontWeight: 700 }}>Super Admin</div>
                  <div style={{ fontSize: '11px', color: '#94A3B8' }}>admin@nyayasetu.in</div>
                </div>
              </div>
            </div>

            <div className="content-area">
              {alertMsg && (
                <div style={{ background: '#064E3B', color: '#6EE7B7', padding: '12px 16px', borderRadius: '8px', marginBottom: '20px', fontWeight: 600 }}>
                  ✓ {alertMsg}
                </div>
              )}

              {currentTab === 'dashboard' && (
                <div>
                  <h2 style={{ fontSize: '26px', fontWeight: 800, marginBottom: '6px' }}>Executive Ecosystem Overview</h2>
                  <p style={{ color: '#94A3B8', fontSize: '14px', marginBottom: '24px' }}>Real-time metrics across Indian advocates, law students, citizens and cases.</p>

                  <div className="kpi-grid">
                    <div className="kpi-card">
                      <div className="kpi-title">Total Registered Users</div>
                      <div className="kpi-val">{metrics.total_users}</div>
                      <div className="kpi-sub">↑ 12% this month</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-title">Verified Advocates</div>
                      <div className="kpi-val">{metrics.verified_lawyers}</div>
                      <div className="kpi-sub" style={{ color: '#D4AF37' }}>Bar Council Verified</div>
                    </div>
                    <div className="kpi-card highlight">
                      <div className="kpi-title" style={{ color: '#F59E0B' }}>Pending Verifications</div>
                      <div className="kpi-val" style={{ color: '#F59E0B' }}>{metrics.pending_verifications}</div>
                      <div className="kpi-sub" style={{ color: '#F59E0B' }}>Action Required</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-title">Active Cases & Workspaces</div>
                      <div className="kpi-val">{metrics.total_cases}</div>
                      <div className="kpi-sub">Encrypted Workspaces</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-title">Open Jobs & Internships</div>
                      <div className="kpi-val">{metrics.total_jobs}</div>
                      <div className="kpi-sub">Career Market</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-title">Pending Reports</div>
                      <div className="kpi-val" style={{ color: '#EF4444' }}>{metrics.pending_reports}</div>
                      <div className="kpi-sub" style={{ color: '#EF4444' }}>Moderation Queue</div>
                    </div>
                  </div>

                  <div className="table-card">
                    <div className="table-head-row">
                      <div className="table-title">Pending Bar Verifications ({requests.length})</div>
                      <button className="btn btn-outline" onClick={() => setCurrentTab('verifications')}>View All Queue</button>
                    </div>
                    <table>
                      <thead>
                        <tr>
                          <th>Advocate Name</th>
                          <th>Bar Council State</th>
                          <th>Enrollment No.</th>
                          <th>Court</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        {requests.map(r => (
                          <tr key={r.id}>
                            <td style={{ fontWeight: 700 }}>{r.full_name}</td>
                            <td>{r.bar_state}</td>
                            <td style={{ fontFamily: 'monospace', color: '#38BDF8' }}>{r.enrollment_number}</td>
                            <td>{r.primary_court}</td>
                            <td>
                              <button className="btn btn-gold" onClick={() => setCurrentTab('verifications')}>Inspect</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentTab === 'verifications' && (
                <div>
                  <h2 style={{ fontSize: '26px', fontWeight: 800, marginBottom: '6px' }}>Bar Council Enrollment Verifications</h2>
                  <p style={{ color: '#94A3B8', fontSize: '14px', marginBottom: '24px' }}>Inspect Sanad certificates, verify state bar enrollment numbers and assign Verified badges.</p>

                  <div className="table-card">
                    <table>
                      <thead>
                        <tr>
                          <th>Advocate Name</th>
                          <th>Bar Jurisdiction</th>
                          <th>Enrollment No.</th>
                          <th>Primary Court</th>
                          <th>Experience</th>
                          <th>Status</th>
                          <th style={{ textAlign: 'right' }}>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {requests.map(r => (
                          <tr key={r.id}>
                            <td style={{ fontWeight: 700 }}>{r.full_name}</td>
                            <td>{r.bar_state}</td>
                            <td style={{ fontFamily: 'monospace', color: '#38BDF8', fontWeight: 700 }}>{r.enrollment_number}</td>
                            <td>{r.primary_court}</td>
                            <td>{r.exp}</td>
                            <td><span className="badge badge-pending">Pending Review</span></td>
                            <td style={{ textAlign: 'right' }}>
                              <button className="btn btn-green" style={{ marginRight: '8px' }} onClick={() => handleApprove(r.id)}>✓ Approve & Badge</button>
                              <button className="btn btn-red" onClick={() => handleReject(r.id)}>✗ Reject</button>
                            </td>
                          </tr>
                        ))}
                        {requests.length === 0 && (
                          <tr><td colSpan="7" style={{ textAlign: 'center', padding: '30px', color: '#94A3B8' }}>All verifications have been processed!</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentTab === 'users' && (
                <div>
                  <h2 style={{ fontSize: '26px', fontWeight: 800, marginBottom: '6px' }}>User & Advocate Management</h2>
                  <p style={{ color: '#94A3B8', fontSize: '14px', marginBottom: '24px' }}>Manage roles, bar privileges, and account standing.</p>

                  <div className="table-card">
                    <table>
                      <thead>
                        <tr>
                          <th>Full Name & Email</th>
                          <th>Ecosystem Role</th>
                          <th>Court / Institution</th>
                          <th>Verification</th>
                          <th>Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        {users.map(u => (
                          <tr key={u.id}>
                            <td>
                              <div style={{ fontWeight: 700 }}>{u.full_name}</div>
                              <div style={{ fontSize: '12px', color: '#94A3B8' }}>{u.email}</div>
                            </td>
                            <td><span className="badge" style={{ backgroundColor: '#1E293B', color: '#38BDF8' }}>{u.role}</span></td>
                            <td>{u.court}</td>
                            <td>{u.verified ? <span className="badge badge-verified">✓ Verified</span> : <span className="badge badge-pending">Unverified</span>}</td>
                            <td><span className="badge badge-verified">Active</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentTab === 'moderation' && (
                <div>
                  <h2 style={{ fontSize: '26px', fontWeight: 800, marginBottom: '6px' }}>Content Moderation Queue</h2>
                  <p style={{ color: '#94A3B8', fontSize: '14px', marginBottom: '24px' }}>Review user reports on misleading legal claims, scam job ads, and privacy violations.</p>

                  <div className="table-card">
                    <table>
                      <thead>
                        <tr>
                          <th>Target Content</th>
                          <th>Violation Reason</th>
                          <th>Reported Detail</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td style={{ fontWeight: 700 }}>WhatsApp as Primary Evidence in Trial</td>
                          <td><span className="badge" style={{ backgroundColor: 'rgba(239, 68, 68, 0.2)', color: '#EF4444' }}>Misleading Information</span></td>
                          <td style={{ color: '#CBD5E1' }}>Post claims uncertified WhatsApp messages are admissible without 63 BSA certificate.</td>
                          <td><button className="btn btn-red" onClick={() => { setAlertMsg('Flagged post removed.'); setTimeout(() => setAlertMsg(null), 3000); }}>Remove Content</button></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<AdminApp />, document.getElementById('root'));
  </script>
</body>
</html>
